<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kana & Hangul Practice</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1a2e;--sf:#16213e;--sl:#1f2b4d;--ac:#4fc3f7;--ad:#2ea0c8;--ok:#4caf50;--er:#ef5350;--tx:#e0e0e0;--dm:#9e9e9e;--bd:#37474f}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;overflow-x:hidden}
.scr{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px}
#modeScr{padding-top:8vh}
.ttl{font-size:36px;font-weight:700;color:var(--ac)}
.hint{font-size:13px;color:var(--dm)}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tab{flex:1;padding:12px 8px;background:none;border:none;border-bottom:2px solid var(--bd);color:var(--dm);font-size:16px;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tab:hover{color:var(--tx)}
.tab.on{border-bottom-color:var(--ac);color:var(--ac);background:rgba(79,195,247,.05)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mb{padding:12px 20px;border:2px solid var(--bd);border-radius:12px;background:var(--sl);color:var(--tx);font-size:16px;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mb:hover{border-color:var(--ac)}.mb.on{border-color:var(--ac);background:#2a4080;color:var(--ac)}
.mb.off{opacity:.5}
.sb{padding:16px 48px;border:none;border-radius:12px;background:var(--ac);color:#fff;font-size:18px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sb:hover{background:var(--ad)}.sb.off{opacity:.4;pointer-events:none}
.go-wrap{width:100%;display:flex;justify-content:center}
.bc{width:100%;display:flex;justify-content:flex-start;align-items:center}
.bb{display:flex;align-items:center;gap:6px;padding:8px 12px;background:none;border:1px solid var(--bd);border-radius:10px;color:var(--dm);font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bb:hover{border-color:var(--ac);color:var(--ac)}
.mwprev{width:100%;display:none;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;padding:10px;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
.mwprev.on{display:flex}
.mwprev .mc{cursor:default}
.mwprev .note{font-size:12px;color:var(--dm);width:100%;text-align:center}
.pbw{width:100%;height:6px;background:var(--sl);border-radius:3px;overflow:hidden}
.pb{height:100%;background:var(--ac);transition:width .2s}
.pt{font-size:14px;color:var(--dm)}
.row{display:flex;align-items:center;gap:14px;width:100%;max-width:480px;margin:0 auto}
.chr{flex:1;font-size:min(170px,28vh);font-weight:700;line-height:1.1;min-height:28vh;display:flex;align-items:center;justify-content:center}
.lsb{width:52px;height:52px;border-radius:50%;border:2px solid var(--bd);background:var(--sl);color:var(--tx);font-size:22px;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0;transition:all .15s}
.lsb:hover{border-color:var(--ac);background:#2a4080;color:var(--ac)}
.lsb:active{background:#2a4080}
.lsb.off{display:none}
.iw{width:85%;max-width:360px}
.inp{width:100%;padding:14px 20px;border:2px solid var(--bd);border-radius:12px;background:var(--sl);color:var(--tx);font-size:20px;text-align:center;outline:none;-webkit-appearance:none;font-family:inherit}
.inp::placeholder{color:var(--dm)}.inp:focus{border-color:var(--ac)}
@keyframes shk{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-8px) rotate(-1.5deg)}50%{transform:translateX(8px) rotate(1.5deg)}75%{transform:translateX(-5px) rotate(-.5deg)}}
.shk{animation:shk .35s;border-color:var(--er)!important;box-shadow:0 0 0 3px rgba(239,83,80,.2)!important}
@keyframes gf{0%,100%{border-color:var(--bd)!important;background:var(--sl)!important;box-shadow:none!important}50%{border-color:var(--ok)!important;background:rgba(76,175,80,.15)!important;box-shadow:0 0 16px rgba(76,175,80,.4)!important}}
.gfl{animation:gf .6s ease}
@keyframes cg{0%,100%{text-shadow:none}50%{color:var(--ok);text-shadow:0 0 24px rgba(76,175,80,.6)}}
.ck{animation:cg .5s}
.rbg{padding:8px;background:none;border:none;color:var(--er);font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:none;width:100%;text-align:center}
.rbg.show{display:block}.rbg:hover{text-decoration:underline}
.stb{width:100%;padding:8px;background:none;border:none;color:var(--dm);font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sp{width:90%;display:none;flex-direction:column;gap:4px;padding:10px;background:var(--sl);border-radius:10px;align-items:stretch}
.sp.on{display:flex}
.sr{display:flex;justify-content:space-between;font-size:13px;color:var(--dm);align-items:center;gap:8px}.sv{color:var(--tx);font-weight:600}
.mc-row{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0}.mc{padding:2px 8px;background:rgba(239,83,80,.15);border-radius:4px;font-size:13px;color:#ef9a9a}.mc b{font-weight:700}
.cb{padding:6px 12px;background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.3);border-radius:6px;color:#ef9a9a;font-size:12px;cursor:pointer;align-self:center;margin-top:4px}
.wcb{width:100%;padding:8px;background:none;border:none;color:var(--dm);font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wcb:hover{color:var(--tx)}
.wp{width:100%;display:none;flex-direction:column;gap:10px;padding:12px;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
.wp.on{display:flex}
.seg{display:flex;gap:6px;justify-content:center}
.seg button{flex:1;padding:8px;background:var(--sl);border:1px solid var(--bd);border-radius:8px;color:var(--dm);font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.seg button.on{border-color:var(--ac);color:var(--ac);background:rgba(79,195,247,.08)}
.wsec{display:flex;flex-direction:column;gap:5px}
.wsec .sl{font-size:12px;font-weight:600;color:var(--dm);letter-spacing:.03em}
.wsec .lst{display:flex;gap:6px;flex-wrap:wrap}
.wsec .lst .mc{cursor:pointer}
.wsec .lst .mc:hover{border-color:var(--ac)}
.wsec .none{font-size:12px;color:var(--dm)}
.rfc{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;padding:4px 8px;background:var(--sl);border:1px solid var(--bd);border-radius:6px;cursor:default}
.rfc b{font-size:18px;font-weight:700;color:var(--tx)}
.rfc span{font-size:11px;color:var(--dm)}
.rfc.kr{cursor:pointer}.rfc.kr:hover{border-color:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(10,10,20,.95);z-index:100;display:none;flex-direction:column;padding:16px;overflow-y:auto}
.ov.on{display:flex}
.ot{font-size:16px;color:var(--dm);margin-bottom:12px;text-align:center}
.rc{flex:1;display:flex;flex-direction:column;gap:8px;margin-bottom:16px;overflow-y:auto}
.rr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sf);border-radius:10px}
.rk{min-width:44px;text-align:center;font-weight:700;font-size:22px;flex-shrink:0}
.sa{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.wr{color:var(--er);text-decoration:line-through;font-style:italic;flex-shrink:0}.ok{color:var(--ok);font-weight:600;flex-shrink:0}
.arr{color:var(--dm);flex-shrink:0}
.ob{padding:10px 20px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.ob.oi{background:var(--ac);color:#fff}.ob.oi:hover{background:var(--ad)}
.ob.os{background:var(--sl);color:var(--tx);border:1px solid var(--bd)}
.ob.od{background:rgba(239,83,80,.15);color:#ef9a9a;border:1px solid rgba(239,83,80,.3)}
.ao{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px 0}
.hidden{display:none!important}
.ct{font-size:28px;font-weight:700;color:var(--ok)}.cs{font-size:16px;color:var(--dm);text-align:center;line-height:1.8}
</style>
</head>
<body>

<!-- Mode Select -->
<div id="modeScr" class="scr">
  <div class="ttl" id="ttl">Kana & Hangul Practice</div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-lang="jp">Japanese</button>
    <button class="tab" data-lang="kr">Korean</button>
  </div>
  <div id="jpPane">
    <div class="btns" id="jpBtns"></div>
    <div class="mwprev" id="jpMwPrev"></div>
    <div class="go-wrap" style="margin-top:16px"><button class="sb go off" data-lang="jp">Start</button></div>
  </div>
  <div id="krPane" class="hidden">
    <div class="btns" id="krBtns"></div>
    <div class="mwprev" id="krMwPrev"></div>
    <div class="go-wrap" style="margin-top:16px"><button class="sb go off" data-lang="kr">Start</button></div>
  </div>
  <button class="wcb" id="wcb">✗ Wrong chars</button>
  <div class="wp" id="wp">
    <div class="seg" id="wseg">
      <button data-view="all" class="on">All-time</button>
      <button data-view="last">Last session</button>
    </div>
    <div id="wlist" style="display:flex;flex-direction:column;gap:12px"></div>
    <button class="cb" id="wreset" style="align-self:center">Reset all data</button>
  </div>
  <button class="wcb" id="rfb">📖 Reference</button>
  <div class="wp" id="rfp"></div>
</div>

<!-- Practice -->
<div id="prScr" class="scr hidden">
  <div class="bc"><button class="bb" id="bmenu">← Menu</button></div>
  <div class="pbw"><div class="pb" id="pb"></div></div>
  <div class="pt" id="pt">0 / 0</div>
  <div class="row">
    <div class="chr" id="chr"></div>
    <button class="lsb off" id="lsb" aria-label="Listen">🔊</button>
  </div>
  <div class="iw"><input type="text" class="inp" id="inp" placeholder="type romanization" autocomplete="off" autocorrect="off" enterkeyhint="go"></div>
  <div class="hint" style="opacity:.4">Space / Enter to submit</div>
  <button class="rbg" id="rbg">Wrong: <b id="wc">0</b> — tap to review</button>
  <button class="stb" id="stb">▼ Stats</button>
  <div class="sp" id="sp"></div>
</div>

<!-- Review Overlay -->
<div id="revOv" class="ov">
  <div class="ot" id="revTitle">Wrong answers</div>
  <div class="rc" id="rcards"></div>
  <div class="ao" style="align-items:center">
    <button class="ob os" id="closeRev">Close</button>
    <button class="ob oi" id="retryBtn">Retry <span id="rbc">0</span></button>
    <button class="ob od" id="newBatchBtn">New Batch</button>
  </div>
</div>

<!-- Single Retry Overlay -->
<div id="retryOv" class="ov">
  <div class="ot">Retry</div>
  <div class="row" style="max-width:380px">
    <div class="chr" id="rChr" style="font-size:min(140px,22vh);min-height:22vh"></div>
    <button class="lsb" id="rLsb" aria-label="Listen">🔊</button>
  </div>
  <div class="iw"><input type="text" class="inp" id="rInp" placeholder="type romanization" autocomplete="off" autocorrect="off" enterkeyhint="go"></div>
  <div class="hint" style="margin-top:6px;opacity:.4">Space / Enter to submit</div>
  <div class="ao" style="margin-top:12px">
    <button class="ob os" id="retryBack">← Back to review</button>
  </div>
</div>

<!-- Complete -->
<div id="doneScr" class="ov" style="background:var(--bg)">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;min-width:0">
    <div class="ct">Batch Complete!</div>
    <div class="cs" id="doneStats"></div>
    <div id="doneWrong" style="width:90%;display:flex;flex-direction:column;gap:8px;margin-top:12px"></div>
    <div class="ao" style="margin-top:16px">
      <button class="ob oi" id="doneNew">New Batch</button>
      <button class="ob os" id="doneReview">Review</button>
      <button class="ob os" id="doneOk">Done</button>
    </div>
  </div>
</div>

<script>
// ──────────── DATA SCHEMA ────────────
// K: map char → {c (char), r (accept list), s (legacy 1=hira 0=kata, 2=kr),
//               p (priority for sort), g (group: 'h'|'k'|'c'|'v'|'s'|'x'),
//               sp (spoken text for TTS; only for kr), lang ('jp'|'kr')}
const K={};
let p=0;
function add(c,r,s,g='x',sp=null,lang='jp'){
  const rs=Array.isArray(r)?r:[r];
  K[c]={c,r:rs,s,p:p++,g,sp,lang};
}

// ── KANA ──
(()=>{
  // a-row
  add('あ','a',1);add('ア','a',0);add('い','i',1);add('イ','i',0);
  add('う','u',1);add('ウ','u',0);add('え','e',1);add('エ','e',0);add('お','o',1);add('オ','o',0);
  // ka-row
  add('か','ka',1);add('カ','ka',0);add('が','ga',1);add('ガ','ga',0);
  add('き','ki',1);add('キ','ki',0);add('ぎ','gi',1);add('ギ','gi',0);
  add('く','ku',1);add('ク','ku',0);add('ぐ','gu',1);add('グ','gu',0);
  add('け','ke',1);add('ケ','ke',0);add('げ','ge',1);add('ゲ','ge',0);
  add('こ','ko',1);add('コ','ko',0);add('ご','go',1);add('ゴ','go',0);
  // sa-row
  add('さ','sa',1);add('サ','sa',0);add('ざ','za',1);add('ザ','za',0);
  add('し','shi',1);add('シ','shi',0);add('じ','ji',1);add('ジ','ji',0);
  add('す','su',1);add('ス','su',0);add('ず','zu',1);add('ズ','zu',0);
  add('せ','se',1);add('セ','se',0);add('ぜ','ze',1);add('ゼ','ze',0);
  add('そ','so',1);add('ソ','so',0);add('ぞ','zo',1);add('ゾ','zo',0);
  // ta-row
  add('た','ta',1);add('タ','ta',0);add('だ','da',1);add('ダ','da',0);
  add('ち','chi',1);add('チ','chi',0);add('ぢ',['ji','zi'],1);add('ヂ',['ji','zi'],0);
  add('つ','tsu',1);add('ツ','tsu',0);add('づ','zu',1);add('ヅ','zu',0);
  add('て','te',1);add('テ','te',0);add('で','de',1);add('デ','de',0);
  add('と','to',1);add('ト','to',0);add('ど','do',1);add('ド','do',0);
  // na-row
  add('な','na',1);add('ナ','na',0);add('に','ni',1);add('ニ','ni',0);
  add('ぬ','nu',1);add('ヌ','nu',0);add('ね','ne',1);add('ネ','ne',0);add('の','no',1);add('ノ','no',0);
  // ha-row
  add('は','ha',1);add('ハ','ha',0);add('ば','ba',1);add('バ','ba',0);add('ぱ','pa',1);add('パ','pa',0);
  add('ひ','hi',1);add('ヒ','hi',0);add('び','bi',1);add('ビ','bi',0);add('ぴ','pi',1);add('ピ','pi',0);
  add('ふ','fu',1);add('フ','fu',0);add('ぶ','bu',1);add('ブ','bu',0);add('ぷ','pu',1);add('プ','pu',0);
  add('へ','he',1);add('ヘ','he',0);add('べ','be',1);add('ベ','be',0);
  add('ほ','ho',1);add('ホ','ho',0);add('ぼ','bo',1);add('ボ','bo',0);add('ぽ','po',1);add('ポ','po',0);
  // ma-row
  add('ま','ma',1);add('マ','ma',0);add('み','mi',1);add('ミ','mi',0);
  add('む','mu',1);add('ム','mu',0);add('め','me',1);add('メ','me',0);add('も','mo',1);add('モ','mo',0);
  // ya-row
  add('や','ya',1);add('ヤ','ya',0);add('ゆ','yu',1);add('ユ','yu',0);add('よ','yo',1);add('ヨ','yo',0);
  // ra-row
  add('ら','ra',1);add('ラ','ra',0);add('り','ri',1);add('リ','ri',0);
  add('る','ru',1);add('ル','ru',0);add('れ','re',1);add('レ','re',0);add('ろ','ro',1);add('ロ','ro',0);
  // wo-row
  add('わ','wa',1);add('ワ','wa',0);add('を','wo',1);add('ヲ','wo',0);add('ん','n',1);add('ン','n',0);
})();

// ── HANGUL ──
(()=>{
  // Consonant jamo (initial position) — accept by jamo NAME romanization
  const CONS=[
    ['ㄱ',['giyeok','g'],'기역','c'],
    ['ㄴ',['nieun','n'],'니은','c'],
    ['ㄷ',['digeut','d'],'디귿','c'],
    ['ㄹ',['rieul','r','l'],'리을','c'],
    ['ㅁ',['mieum','m'],'미음','c'],
    ['ㅂ',['bieup','b'],'비읍','c'],
    ['ㅅ',['siot','s','sh'],'시옷','c'],
    ['ㅇ',['ieung','ng'],'이응','c'],
    ['ㅈ',['jieut','z','j'],'지읒','c'],
    ['ㅊ',['chieut','ch','c'],'치읓','c'],
    ['ㅋ',['kieuk','k'],'키읔','c'],
    ['ㅌ',['tieut','t'],'티읕','c'],
    ['ㅍ',['pieut','p'],'피읖','c'],
    ['ㅎ',['hieut','h'],'히읗','c'],
  ];
  CONS.forEach(([c,r,sp])=>add(c,r,2,'c',sp,'kr'));
  // Vowel jamo — basic + double vowels; accept by the SOUND the vowel produces
  const VOWELS=[
    ['ㅏ',['a','ah'],'아'],
    ['ㅑ',['ya'],'야'],
    ['ㅓ',['eo'],'어'],
    ['ㅕ',['yeo'],'여'],
    ['ㅗ',['o','oh'],'오'],
    ['ㅛ',['yo'],'요'],
    ['ㅜ',['u','oo'],'우'],
    ['ㅠ',['yu'],'유'],
    ['ㅡ',['eu'],'으'],
    ['ㅣ',['i'],'이'],
    // Double vowels
    ['ㅐ',['ae'],'애'],
    ['ㅒ',['yae'],'얘'],
    ['ㅔ',['e'],'에'],
    ['ㅖ',['ye'],'예'],
    ['ㅘ',['wa'],'와'],
    ['ㅙ',['wae'],'왜'],
    ['ㅚ',['oe'],'외'],
    ['ㅝ',['wo'],'워'],
    ['ㅞ',['we'],'웨'],
    ['ㅟ',['wi'],'위'],
    ['ㅢ',['ui'],'의'],
  ];
  VOWELS.forEach(([c,r,sp])=>add(c,r,2,'v',sp,'kr'));
  // Syllables — full basic CV set: 10 initials × 10 basic vowels = 100,
  // as composed Hangul codepoints (U+AC00 block).
  // Accepted answer = Revised-Romanization base of initial + vowel
  // (ㄹ-row accepts both r- and l- spellings).
  const SYL=[
    ['가',['ga']], ['갸',['gya']], ['거',['geo']], ['겨',['gyeo']], ['고',['go']],
    ['교',['gyo']], ['구',['gu']], ['규',['gyu']], ['그',['geu']], ['기',['gi']],
    ['나',['na']], ['냐',['nya']], ['너',['neo']], ['녀',['nyeo']], ['노',['no']],
    ['뇨',['nyo']], ['누',['nu']], ['뉴',['nyu']], ['느',['neu']], ['니',['ni']],
    ['다',['da']], ['댜',['dya']], ['더',['deo']], ['뎌',['dyeo']], ['도',['do']],
    ['됴',['dyo']], ['두',['du']], ['듀',['dyu']], ['드',['deu']], ['디',['di']],
    ['라',['ra','la']], ['랴',['rya','lya']], ['러',['reo','leo']], ['려',['ryeo','lyeo']],
    ['로',['ro','lo']], ['료',['ryo','lyo']], ['루',['ru','lu']], ['류',['ryu','lyu']],
    ['르',['reu','leu']], ['리',['ri','li']],
    ['마',['ma']], ['먀',['mya']], ['머',['meo']], ['며',['myeo']], ['모',['mo']],
    ['묘',['myo']], ['무',['mu']], ['뮤',['myu']], ['므',['meu']], ['미',['mi']],
    ['바',['ba']], ['뱌',['bya']], ['버',['beo']], ['벼',['byeo']], ['보',['bo']],
    ['뵤',['byo']], ['부',['bu']], ['뷰',['byu']], ['브',['beu']], ['비',['bi']],
    ['사',['sa']], ['샤',['sya']], ['서',['seo']], ['셔',['syeo']], ['소',['so']],
    ['쇼',['syo']], ['수',['su']], ['슈',['syu']], ['스',['seu']], ['시',['si']],
    ['아',['a']], ['야',['ya']], ['어',['eo']], ['여',['yeo']], ['오',['o']],
    ['요',['yo']], ['우',['u']], ['유',['yu']], ['으',['eu']], ['이',['i']],
    ['자',['ja']], ['쟈',['jya']], ['저',['jeo']], ['져',['jyeo']], ['조',['jo']],
    ['죠',['jyo']], ['주',['ju']], ['쥬',['jyu']], ['즈',['jeu']], ['지',['ji']],
    ['하',['ha']], ['햐',['hya']], ['허',['heo']], ['혀',['hyeo']], ['호',['ho']],
    ['효',['hyo']], ['후',['hu']], ['휴',['hyu']], ['흐',['heu']], ['히',['hi']],
  ];
  SYL.forEach(([c,accents])=>add(c,accents,2,'s',c,'kr'));
})();
const ALL=Object.values(K);

// ──────────── STATE ────────────
let batch=[],idx=0,curMode=null,curLang=null;
let wrongSet=new Set(),wrongAns={};
let streak=0,bestStreak=0;
let submitting=false;
let curTab='jp';
let sessionWrong={};              // char → count, current batch only
let lastSession=null;             // snapshot {char:count} of the last finished/abandoned session
let retryRound=false;             // retry rounds are pure practice: no writes to stored data

// ──────────── HELPERS ────────────
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const primary=k=>Array.isArray(k.r)?k.r[0]:k.r;
const isCorrect=(k,g)=>{const gg=g.toLowerCase();return Array.isArray(k.r)?k.r.includes(gg):k.r===gg};
const isSubmitKey=e=>['Enter','Go'].includes(e.key)||['Enter','Space','Go'].includes(e.code)||e.key===' ';
const isSpaceKey=e=>e.key===' '||e.code==='Space';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ──────────── LOCAL STORAGE ────────────
const KEY='syllabics_wrong';
const LAST_KEY='syllabics_last_session';
function getWrong(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return{}}}
function setWrong(d){localStorage.setItem(KEY,JSON.stringify(d))}
// e = {c (all-time miss count), t (last miss), w (Most-Wrong weight; w-1 on first-try correct)}
function recordWrong(char){const d=getWrong();const e=d[char]||{c:0,t:0};e.c++;e.w=(e.w!=null?e.w:e.c-1)+1;e.t=Date.now();d[char]=e;setWrong(d);sessionWrong[char]=(sessionWrong[char]||0)+1;updateStats()}
function recordCorrect(char){const d=getWrong();const e=d[char];if(!e)return;e.w=Math.max(0,(e.w!=null?e.w:e.c)-1);setWrong(d)}
function getLastSession(){try{return JSON.parse(localStorage.getItem(LAST_KEY))||null}catch{return null}}
function setLastSession(d){localStorage.setItem(LAST_KEY,JSON.stringify(d))}
function snapshotSession(){setLastSession(sessionWrong);lastSession={...sessionWrong}}
function topWrongInfo(limit,lang){
  const W=e=>e.w!=null?e.w:e.c;              // old entries (no w) fall back to c
  const d=getWrong();
  const qual=Object.entries(d)
    .filter(([c,v])=>K[c]&&W(v)>=3&&(lang?K[c].lang===lang:true))
    .sort((a,b)=>W(b[1])-W(a[1])||b[1].t-a[1].t);
  return {items:qual.slice(0,limit).map(([c])=>K[c]),total:qual.length};
}
function getTopWrong(limit,lang){
  return topWrongInfo(limit,lang).items.sort((a,b)=>{
    // Sort by group first, then by original priority
    const gA=a.g||'x',gB=b.g||'x';
    if(gA!==gB){
      const order={'h':0,'k':1,'c':2,'v':3,'s':4,'x':5};
      return (order[gA]??99)-(order[gB]??99);
    }
    return a.p-b.p;
  });
}

// ──────────── BATCH LOGIC ────────────
function buildBatch(m){
  let arr;
  if(m==='h')arr=ALL.filter(k=>k.g==='x'&&k.s===1);
  else if(m==='k')arr=ALL.filter(k=>k.g==='x'&&k.s===0);
  else if(m==='b')arr=ALL.filter(k=>k.g==='x');            // all kana (hiragana + katakana)
  else if(m==='c')arr=ALL.filter(k=>k.g==='c');
  else if(m==='v')arr=ALL.filter(k=>k.g==='v');
  else if(m==='s')arr=ALL.filter(k=>k.g==='s');
  else if(m==='mw')arr=getTopWrong(20,curLang);
  else arr=[];
  return shuffle(arr);
}

function startPractice(m){
  const arr=buildBatch(m);
  if(!arr.length){
    if(m==='mw')alert('Nothing selected yet. A character is added to Most Wrong after 3 wrong answers.');
    else alert('No characters for this mode.');
    return;
  }
  curMode=m;curLang=(K[arr[0]]||{}).lang;
  retryRound=false;
  batch=arr;idx=0;wrongSet=new Set();wrongAns={};sessionWrong={};streak=0;bestStreak=0;
  $('modeScr').classList.add('hidden');$('prScr').classList.remove('hidden');
  $('doneScr').classList.remove('on');$('revOv').classList.remove('on');$('retryOv').classList.remove('on');
  updateStats();
  showChar();
}

// ──────────── PRACTICE ────────────
// Listen = "stuck helper": speak the Korean name / sound / syllable of the shown char.
//   Uses the `sp` field (Korean text). Voice = Korean (ko-KR); if none is
//   installed the browser decides (may be an accented default or silence).
function speak(k){
  if(!k)return;
  if(!('speechSynthesis' in window))return;
  const text=k.sp||k.c;
  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.7;u.pitch=1;
  u.lang='ko-KR';
  const voices=speechSynthesis.getVoices();
  const ko=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));
  if(ko)u.voice=ko;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function showChar(){
  if(idx>=batch.length){finishBatch();return}
  const k=batch[idx];
  $('chr').textContent=k.c;$('chr').className='chr';
  $('lsb').classList.toggle('off',!(k&&k.lang==='kr'));
  const inp=$('inp');inp.value='';inp.className='inp';inp.focus();
  updateProg();updateBadge();
}

function updateProg(){$('pb').style.width=(batch.length?idx/batch.length*100:0)+'%';$('pt').textContent=`${idx} / ${batch.length}`}
function updateBadge(){if(wrongSet.size){$('wc').textContent=wrongSet.size;$('rbg').classList.add('show')}else $('rbg').classList.remove('show')}

function submit(){
  if(idx>=batch.length)return;
  if(submitting)return;
  const k=batch[idx],inp=$('inp'),guess=inp.value.trim();
  if(!guess)return;
  submitting=true;
  if(isCorrect(k,guess)){
    streak++;if(streak>bestStreak)bestStreak=streak;
    if(!retryRound&&!wrongSet.has(k.c))recordCorrect(k.c);
    $('chr').classList.add('ck');inp.classList.add('gfl');
    setTimeout(()=>{
      submitting=false;
      $('chr').classList.remove('ck');
      inp.classList.remove('gfl');
      idx++;updateProg();showChar();
    },550);
  }else{
    streak=0;
    wrongSet.add(k.c);wrongAns[k.c]=guess;
    if(!retryRound)recordWrong(k.c);
    inp.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('shk');inp.focus();submitting=false},400);
    inp.select();inp.focus();
    updateBadge();
  }
}

$('inp').addEventListener('keydown',e=>{if(isSpaceKey(e)||isSubmitKey(e)){e.preventDefault();submit()}});
$('lsb').addEventListener('click',()=>{const k=batch[idx];if(k)speak(k)});

// ──────────── REVIEW ────────────
function openReview(){
  if(!wrongSet.size)return;
  const items=[...wrongSet].map(c=>K[c]).filter(Boolean).sort((a,b)=>{
    const gA=a.g||'x',gB=b.g||'x';
    const order={'h':0,'k':1,'c':2,'v':3,'s':4,'x':5};
    if(gA!==gB)return (order[gA]??99)-(order[gB]??99);
    return a.p-b.p;
  });
  $('revTitle').textContent=`Wrong answers (${items.length})`;
  const rc=$('rcards');rc.innerHTML='';
  items.forEach(k=>{
    const row=document.createElement('div');row.className='rr';
    row.innerHTML=`<span class="rk">${k.c}</span>
      <span class="sa"><span class="wr">${esc(wrongAns[k.c]||'—')}</span><span class="arr">→</span><span class="ok">${primary(k)}</span></span>`;
    const btn=document.createElement('button');btn.className='ob oi';btn.style.flexShrink='0';btn.textContent='retry';
    btn.addEventListener('click',()=>openRetry(k.c));row.appendChild(btn);
    rc.appendChild(row);
  });
  $('rbc').textContent=items.length;
  $('revOv').classList.add('on');
}

function openRetry(char){
  const k=K[char];if(!k)return;
  $('rChr').textContent=k.c;$('rChr').className='chr';
  $('rLsb').classList.toggle('off',k.lang!=='kr');
  $('rLsb').onclick=()=>speak(k);
  const inp=$('rInp');inp.value='';inp.className='inp';
  let busy=false;
  const doRetry=()=>{
    if(busy)return;
    const g=inp.value.trim();if(!g)return;
    if(isCorrect(k,g)){
      busy=true;
      inp.classList.add('gfl');
      setTimeout(()=>{busy=false;inp.classList.remove('gfl');$('retryOv').classList.remove('on');openReview()},500);
    }else{
      inp.classList.add('shk');
      setTimeout(()=>{inp.classList.remove('shk');inp.focus()},400);
    }
  };
  if(inp._onKeyDown)inp.removeEventListener('keydown',inp._onKeyDown);
  inp._onKeyDown=ev=>{if(isSpaceKey(ev)||isSubmitKey(ev)){ev.preventDefault();doRetry()}};
  inp.addEventListener('keydown',inp._onKeyDown);
  $('retryOv').classList.add('on');
  setTimeout(()=>inp.focus(),80);
}

// ──────────── ACTIONS ────────────
let reviewFrom='practice';
$('rbg').addEventListener('click',()=>{reviewFrom='practice';openReview()});
$('closeRev').addEventListener('click',()=>{
  $('revOv').classList.remove('on');
  if(reviewFrom==='done')$('doneScr').classList.add('on');
});
$('retryBack').addEventListener('click',()=>$('retryOv').classList.remove('on'));
$('retryBtn').addEventListener('click',()=>{
  const items=shuffle([...wrongSet].map(c=>K[c]).filter(Boolean));
  if(!items.length)return;
  retryRound=true;reviewFrom='practice';
  batch=items;idx=0;wrongSet=new Set();wrongAns={};streak=0;bestStreak=0;
  $('revOv').classList.remove('on');$('retryOv').classList.remove('on');showChar();
});
$('newBatchBtn').addEventListener('click',startBatch);
$('doneNew').addEventListener('click',startBatch);
$('doneOk').addEventListener('click',()=>{
  $('doneScr').classList.remove('on');$('prScr').classList.add('hidden');
  $('modeScr').classList.remove('hidden');
  updateHints();
});

function startBatch(){$('doneScr').classList.remove('on');startPractice(curMode)}
function finishBatch(){
  if(!retryRound&&Object.keys(sessionWrong).length)snapshotSession();
  updateHints();
  const t=batch.length,m=wrongSet.size;
  const lang=curLang==='kr'?'Hangeul':'Kana';
  $('doneStats').innerHTML=`<strong>${lang}</strong>${retryRound?' (retry round)':''}<br>${t-m} / ${t} correct — ${t?Math.round((t-m)/t*100):100}%<br>Best streak: ${bestStreak}`;
  const dw=$('doneWrong');dw.innerHTML='';
  if(m){
    const sorted=[...wrongSet].map(c=>K[c]).filter(Boolean).sort((a,b)=>{
      const gA=a.g||'x',gB=b.g||'x';
      const order={'h':0,'k':1,'c':2,'v':3,'s':4,'x':5};
      if(gA!==gB)return (order[gA]??99)-(order[gB]??99);
      return a.p-b.p;
    });
    const lbl=document.createElement('div');lbl.className='hint';lbl.style.width='100%';lbl.textContent=`Missed (${m})`;dw.appendChild(lbl);
    sorted.forEach(k=>{
      const chip=document.createElement('span');chip.className='mc';chip.style.cursor='default';
      chip.innerHTML=`<b>${k.c}</b> <span class="wr">${esc(wrongAns[k.c]||'—')}</span> → <span class="ok">${primary(k)}</span>`;
      dw.appendChild(chip);
    });
    $('doneReview').style.display='';
  }else{
    const lbl=document.createElement('div');lbl.className='hint';lbl.style.width='100%';lbl.textContent='Perfect batch';dw.appendChild(lbl);
    $('doneReview').style.display='none';
  }
  $('doneScr').classList.add('on');
}
$('doneReview').addEventListener('click',()=>{$('doneScr').classList.remove('on');reviewFrom='done';openReview()});

// ──────────── STATS (session-only) ────────────
function updateStats(){
  const byLang=l=>Object.entries(sessionWrong).filter(([c])=>K[c]&&K[c].lang===l)
    .sort((a,b)=>b[1]-a[1]).map(([c,n])=>[c,n]).slice(0,3);
  const sessTotal=Object.values(sessionWrong).reduce((s,n)=>s+n,0);
  const el=$('sp');el.innerHTML='';
  const mk=(l,v)=>{const r=document.createElement('div');r.className='sr';r.innerHTML=`<span>${l}</span><span class="sv">${v}</span>`;return r};
  el.appendChild(mk('Session mistakes',sessTotal));
  ['jp','kr'].forEach(l=>{
    const worst=byLang(l);
    if(worst.length){
      const row=document.createElement('div');row.className='mc-row';
      row.style.borderLeft='2px solid var(--bd)';
      worst.forEach(([ch,n])=>{const m=document.createElement('span');m.className='mc';m.innerHTML=`<b>${ch}</b> ×${n}`;row.appendChild(m)});
      el.appendChild(row);
    }
  });
  el.appendChild(mk('Best streak (session)',bestStreak));
}

$('stb').addEventListener('click',()=>{
  const sp=$('sp');sp.classList.toggle('on');
  $('stb').textContent=sp.classList.contains('on')?'▲ Stats':'▼ Stats';
  if(sp.classList.contains('on'))updateStats();
});

// ──────────── WRONG CHARS (menu) ────────────
let wrongView='all';
function renderWrongList(){
  const src=wrongView==='all'?getWrong():(lastSession||{});
  // normalize to {char:count}
  const norm={};
  Object.entries(src).forEach(([c,v])=>{norm[c]=(v&&v.c!=null)?v.c:v});
  const build=(label,lang)=>{
    const sec=document.createElement('div');sec.className='wsec';
    const items=Object.entries(norm).filter(([c])=>K[c]&&K[c].lang===lang)
      .sort((a,b)=>(b[1]-a[1])||(K[a[0]].p-K[b[0]].p));
    const sl=document.createElement('div');sl.className='sl';sl.textContent=label;sec.appendChild(sl);
    if(!items.length){const n=document.createElement('div');n.className='none';n.textContent='none';sec.appendChild(n);return sec}
    const lst=document.createElement('div');lst.className='lst';
    items.forEach(([c,n])=>{const m=document.createElement('span');m.className='mc';m.innerHTML=`<b>${c}</b> ×${n}`;lst.appendChild(m)});
    sec.appendChild(lst);
    return sec;
  };
  const box=$('wlist');box.innerHTML='';
  box.appendChild(build('Kana','jp'));
  box.appendChild(build('Hangeul','kr'));
}
function setWrongView(v){
  wrongView=v;
  [...$('wseg').children].forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  renderWrongList();
}
$('wcb').addEventListener('click',()=>{
  const wp=$('wp');wp.classList.toggle('on');
  if(wp.classList.contains('on'))renderWrongList();
});
$('wseg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setWrongView(b.dataset.view)});
$('wreset').addEventListener('click',()=>{
  if(!confirm('Reset all mistake data (all-time)?'))return;
  localStorage.removeItem(KEY);localStorage.removeItem(LAST_KEY);
  lastSession=null;updateHints();renderWrongList();
});

// ──────────── BACK / EXIT ────────────
const practiceActive=()=>$('prScr')&&!$('prScr').classList.contains('hidden');
function exitPractice(){
  if(Object.keys(sessionWrong).length){snapshotSession();updateHints();}
  $('doneScr').classList.remove('on');$('revOv').classList.remove('on');$('retryOv').classList.remove('on');
  $('prScr').classList.add('hidden');$('modeScr').classList.remove('hidden');
  batch=[];idx=0;streak=0;bestStreak=0;retryRound=false;
  updateHints();
}
$('bmenu').addEventListener('click',()=>{
  if(!practiceActive()){exitPractice();return}
  if(idx<batch.length&&confirm('Leave practice? This batch is not saved (mistakes are still recorded).'))exitPractice();
});
window.addEventListener('beforeunload',e=>{
  if(!practiceActive()||idx>=batch.length)return;
  e.preventDefault();e.returnValue='';
});
lastSession=getLastSession();

// ──────────── TAB / MODE UI ────────────
function renderMwPreview(lang){
  const box=$(lang+'MwPrev');if(!box)return;
  const info=topWrongInfo(20,lang);
  const items=info.items;
  box.innerHTML='';
  if(!items.length){
    const n=document.createElement('span');n.className='note';
    n.textContent='No characters selected. A character is added after 3 wrong answers.';
    box.appendChild(n);return;
  }
  const note=document.createElement('span');note.className='note';
  note.textContent=info.total>20?`20 of ${info.total} characters selected (most missed first)`:`${items.length===1?'1 character':items.length+' characters'} selected (3+ wrong answers each)`;
  box.appendChild(note);
  items.forEach(k=>{
    const m=document.createElement('span');m.className='mc';
    m.innerHTML=`<b>${k.c}</b> ×${(getWrong()[k.c]||{c:0}).c}`;
    m.title=primary(k);
    box.appendChild(m);
  });
}
function syncMwPreviews(){
  if($('jpBtns').querySelector('.mb.on')?.dataset.mode==='mw')renderMwPreview('jp');
  if($('krBtns').querySelector('.mb.on')?.dataset.mode==='mw')renderMwPreview('kr');
}
function updateHints(){
  syncMwPreviews();
}

const JP_MODES=[
  {id:'h',label:'Hiragana'},
  {id:'k',label:'Katakana'},
  {id:'b',label:'Both'},
  {id:'mw',label:'Most Wrong'},
];
const KR_MODES=[
  {id:'c',label:'Consonants'},
  {id:'v',label:'Vowels'},
  {id:'s',label:'Syllables'},
  {id:'mw',label:'Most Wrong'},
];

function buildModeBtns(container,modes,lang){
  container.innerHTML='';
  const prev=$(lang+'MwPrev');
  modes.forEach(m=>{
    const btn=document.createElement('button');
    btn.className='mb';btn.textContent=m.label;
    btn.dataset.mode=m.id;btn.dataset.lang=lang;
    btn.addEventListener('click',()=>{
      [...container.children].forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      const go=container.parentElement.querySelector('.go');
      if(go)go.classList.remove('off');
      if(prev){
        if(m.id==='mw'){renderMwPreview(lang);prev.classList.add('on');}
        else prev.classList.remove('on');
      }
    });
    container.appendChild(btn);
  });
}

buildModeBtns($('jpBtns'),JP_MODES,'jp');
buildModeBtns($('krBtns'),KR_MODES,'kr');

// ──────────── REFERENCE ────────────
function renderReference(){
  const box=$('rfp');box.innerHTML='';
  const all=Object.values(K).filter(k=>k.lang===curTab);
  const secs=curTab==='jp'
    ?[['Hiragana',k=>k.s===1],['Katakana',k=>k.s===0]]
    :[['Consonants',k=>k.g==='c'],['Vowels',k=>k.g==='v'],['Syllables',k=>k.g==='s']];
  secs.forEach(([title,fn])=>{
    const items=all.filter(fn);
    if(!items.length)return;
    const sec=document.createElement('div');sec.className='wsec';
    const sl=document.createElement('div');sl.className='sl';sl.textContent=`${title} (${items.length})`;sec.appendChild(sl);
    const lst=document.createElement('div');lst.className='lst';
    items.forEach(k=>{
      const c=document.createElement('div');c.className='rfc'+(curTab==='kr'?' kr':'');
      const b=document.createElement('b');b.textContent=k.c;
      const a=document.createElement('span');a.textContent=k.r.join(' / ');
      c.appendChild(b);c.appendChild(a);
      if(curTab==='kr')c.addEventListener('click',()=>speak(k));
      lst.appendChild(c);
    });
    sec.appendChild(lst);box.appendChild(sec);
  });
}
$('rfb').addEventListener('click',()=>{
  const p=$('rfp');p.classList.toggle('on');
  if(p.classList.contains('on'))renderReference();
});
$('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t)return;
  const lang=t.dataset.lang;
  curTab=lang;
  [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===t));
  $('jpPane').classList.toggle('hidden',lang!=='jp');
  $('krPane').classList.toggle('hidden',lang!=='kr');
  // Reset "on" states to avoid double "on"
  if($('rfp').classList.contains('on'))renderReference();
});

document.querySelectorAll('.go').forEach(go=>{
  go.addEventListener('click',()=>{
    const lang=go.dataset.lang;
    // Find the currently-on mode button in that pane
    const pane=lang==='jp'?$('jpPane'):$('krPane');
    const on=pane.querySelector('.mb.on');
    if(!on){
      // No mode selected — flash the button row
      pane.querySelector('.btns').animate(
        [{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],
        {duration:300}
      );
      return;
    }
    curLang=lang;
    startPractice(on.dataset.mode);
  });
});

updateHints();
if ('speechSynthesis' in window) {
  const _ = speechSynthesis.getVoices();
  speechSynthesis.addEventListener('voiceschanged', ()=>speechSynthesis.getVoices());
}
</script>
